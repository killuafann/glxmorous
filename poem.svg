<svg width="650" height="200" viewBox="0 0 650 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#621622" />
      <stop offset="15%" stop-color="#621622" />
      <stop offset="40%" stop-color="#6D2E3E" />
      <stop offset="65%" stop-color="#5A9FA1" />
      <stop offset="85%" stop-color="#9EC3C5" />
      <stop offset="100%" stop-color="#E7EBEC" />
    </linearGradient>

    <filter id="rgb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap');

      .herta-text {
        font-family: 'Great Vibes', 'Brush Script MT', 'Dancing Script', cursive;
        font-size: 28px;
        fill: url(#text-gradient);
        filter: url(#rgb-glow);
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="8" />

  <text x="50%" y="60" class="herta-text">" Madam Herta is a peerless gem.</text>
  <text x="50%" y="110" class="herta-text">Madam Herta is an unrivalled genius.</text>
  <text x="50%" y="160" class="herta-text">Madam Herta is an inimitable beauty. "</text>
</svg>

</svg>
