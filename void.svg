<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="auto">
  <defs>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a1f2d" />
      <stop offset="45%" stop-color="#2d4850" />
      <stop offset="100%" stop-color="#468892" />
    </linearGradient>

    <pattern id="dotPattern" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.8" fill="url(#voidGrad)" opacity="0.35" />
    </pattern>

    <path id="scallop-line" d="M 0 0 
      Q 20 18, 40 0  Q 60 18, 80 0  Q 100 18, 120 0 
      Q 140 18, 160 0 Q 180 18, 200 0 Q 220 18, 240 0 
      Q 260 18, 280 0 Q 300 18, 320 0 Q 340 18, 360 0 
      Q 380 18, 400 0 Q 420 18, 440 0 Q 460 18, 480 0 
      Q 500 18, 520 0 Q 540 18, 560 0 Q 580 18, 600 0 
      Q 620 18, 640 0 Q 660 18, 680 0 Q 700 18, 720 0 
      Q 740 18, 760 0 Q 780 18, 800 0 Q 820 18, 840 0 
      Q 860 18, 880 0 Q 900 18, 920 0 Q 940 18, 960 0 
      Q 980 18, 1000 0" 
      fill="none" stroke="url(#voidGrad)" stroke-width="3.5" stroke-linecap="round" />

    <g id="bow">
      <path d="M 0 -2 Q -35 -25 -45 0 Q -35 25 0 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2.5" />
      <path d="M -5 -1 Q -25 -15 -35 0 Q -25 15 -5 1 Z" fill="url(#dotPattern)" />
      <path d="M 0 -2 Q 35 -25 45 0 Q 35 25 0 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2.5" />
      <path d="M 5 -1 Q 25 -15 35 0 Q 25 15 5 1 Z" fill="url(#dotPattern)" />
      <path d="M -8 2 L -28 32 L -12 28 L -2 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2" />
      <path d="M 8 2 L 28 32 L 12 28 L 2 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2" />
      <rect x="-9" y="-8" width="18" height="16" rx="5" fill="url(#voidGrad)" stroke="#12181f" stroke-width="1.5" />
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="8" fill="url(#voidGrad)" />
  <rect x="0" y="12" width="1000" height="16" fill="url(#dotPattern)" />
  <line x1="0" y1="28" x2="1000" y2="28" stroke="url(#voidGrad)" stroke-width="2" stroke-dasharray="8 6" />

  <g transform="translate(0, 38)">
    <use href="#scallop-line" opacity="0.5" transform="translate(0, -6) scale(1, 0.8)" />
    <use href="#scallop-line" opacity="0.8" transform="translate(0, 4)" />
    <use href="#scallop-line" transform="translate(0, 14)" />
  </g>

  <g transform="translate(0, 68)" opacity="0.6">
    <path d="M 0 0 L 1000 0" stroke="url(#voidGrad)" stroke-width="1.5" stroke-dasharray="12 8" />
  </g>

  <use href="#bow" x="500" y="36" />
</svg>


