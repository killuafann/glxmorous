<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="auto">
  <defs>
    <linearGradient id="voidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a1f2d" />
      <stop offset="45%" stop-color="#2d4850" />
      <stop offset="100%" stop-color="#468892" />
    </linearGradient>

    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="url(#voidGrad)" opacity="0.4" />
    </pattern>

    <path id="scallop-line-large" d="M 0 0 
      Q 25 28, 50 0  Q 75 28, 100 0  Q 125 28, 150 0 
      Q 175 28, 200 0 Q 225 28, 250 0 Q 275 28, 300 0 
      Q 325 28, 350 0 Q 375 28, 400 0 Q 425 28, 450 0 
      Q 475 28, 500 0 Q 525 28, 550 0 Q 575 28, 600 0 
      Q 625 28, 650 0 Q 675 28, 700 0 Q 725 28, 750 0 
      Q 775 28, 800 0 Q 825 28, 850 0 Q 875 28, 900 0 
      Q 925 28, 950 0 Q 975 28, 1000 0" 
      fill="none" stroke="url(#voidGrad)" stroke-width="4.5" stroke-linecap="round" />

    <g id="big-bow" transform="scale(1.4)">
      <path d="M 0 -2 Q -45 -35 -55 0 Q -45 35 0 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="3" />
      <path d="M -5 -1 Q -32 -20 -42 0 Q -32 20 -5 1 Z" fill="url(#dotPattern)" />
      
      <path d="M 0 -2 Q 45 -35 55 0 Q 45 35 0 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="3" />
      <path d="M 5 -1 Q 32 -20 42 0 Q 32 20 5 1 Z" fill="url(#dotPattern)" />
      
      <path d="M -10 2 L -38 45 L -16 40 L -2 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2.5" />
      <path d="M 10 2 L 38 45 L 16 40 L 2 2 Z" fill="#12181f" stroke="url(#voidGrad)" stroke-width="2.5" />
      
      <rect x="-12" y="-10" width="24" height="20" rx="6" fill="url(#voidGrad)" stroke="#12181f" stroke-width="2" />
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="12" fill="url(#voidGrad)" />
  <rect x="0" y="18" width="1000" height="24" fill="url(#dotPattern)" />
  <line x1="0" y1="46" x2="1000" y2="46" stroke="url(#voidGrad)" stroke-width="3" stroke-dasharray="12 8" />

  <g transform="translate(0, 58)">
    <use href="#scallop-line-large" opacity="0.4" transform="translate(0, -8)" />
    <use href="#scallop-line-large" opacity="0.75" transform="translate(0, 8)" />
    <use href="#scallop-line-large" transform="translate(0, 24)" />
  </g>

  <g transform="translate(0, 115)" opacity="0.7">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="url(#voidGrad)" stroke-width="2" stroke-dasharray="16 10" />
  </g>

  <use href="#big-bow" x="357" y="38" />
</svg>



